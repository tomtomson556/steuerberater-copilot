AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Minimal AWS reference-cloud stack for the local FastAPI/Docker demo.
  Synthetic-data portfolio demo only. Default DeployService=false for
  two-stage bootstrap (ECR/LogGroup/VPC first, Express service after
  digest push). Stack-owned public IPv4 VPC (no default-VPC dependency).
  Task Execution Role and Express Infrastructure Role are external static
  roles referenced by required ARN parameters. No stack-owned IAM roles,
  no TaskRoleArn, no Secrets Manager, and no secret values in this
  template. Region expectation: eu-central-1.

Parameters:
  DeployService:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      When true, create AWS::ECS::ExpressGatewayService. Requires a non-empty
      ImageUri with an immutable digest (@sha256:...).

  ImageUri:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[0-9]{12}\.dkr\.ecr\.eu-central-1\.amazonaws\.com/steuerberater-copilot-reference-demo@sha256:[A-Fa-f0-9]{64}$'
    ConstraintDescription: >
      Leave empty for stage-1 bootstrap, or supply a private eu-central-1 ECR
      digest URI for repository steuerberater-copilot-reference-demo when
      DeployService=true.
    Description: Fixed private ECR repository URI by digest only.

  TaskExecutionRoleArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role(/[A-Za-z0-9+=,.@_-]+)*/[A-Za-z0-9+=,.@_-]+$'
    ConstraintDescription: >
      IAM role ARN for the external static Task Execution Role assumed by
      ecs-tasks.amazonaws.com. This stack does not create the role.
    Description: >
      ARN of the external Task Execution Role used for image pull and awslogs.

  ExpressInfrastructureRoleArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role(/[A-Za-z0-9+=,.@_-]+)*/[A-Za-z0-9+=,.@_-]+$'
    ConstraintDescription: >
      IAM role ARN for the external static Express Infrastructure Role assumed
      by ecs.amazonaws.com. This stack does not create the role.
    Description: >
      ARN of the external Express Infrastructure Role used by ECS Express Mode.

Conditions:
  DeployExpressService:
    Fn::And:
      - Fn::Equals:
          - Ref: DeployService
          - "true"
      - Fn::Not:
          - Fn::Equals:
              - Ref: ImageUri
              - ""

Rules:
  DeployServiceRequiresDigestImageUri:
    RuleCondition: !Equals
      - !Ref DeployService
      - "true"
    Assertions:
      - Assert: !Not
          - !Equals
              - !Ref ImageUri
              - ""
        AssertDescription: >
          DeployService=true requires a non-empty ImageUri. AllowedPattern
          enforces digest form repository@sha256:<64 hex>.

Resources:
  ReferenceDemoRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: steuerberater-copilot-reference-demo
      EmptyOnDelete: true
      ImageTagMutability: MUTABLE
      Tags:
        - Key: Project
          Value: steuerberater-copilot
        - Key: Component
          Value: reference-demo
        - Key: Environment
          Value: portfolio-test
        - Key: ManagedBy
          Value: cloudformation
        - Key: Lifecycle
          Value: ephemeral

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /steuerberater-copilot/reference-demo/application
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: steuerberater-copilot
        - Key: Component
          Value: reference-demo
        - Key: Environment
          Value: portfolio-test
        - Key: ManagedBy
          Value: cloudformation
        - Key: Lifecycle
          Value: ephemeral

  DemoVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Project
          Value: steuerberater-copilot
        - Key: Component
          Value: reference-demo
        - Key: Environment
          Value: portfolio-test
        - Key: ManagedBy
          Value: cloudformation
        - Key: Lifecycle
          Value: ephemeral

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVpc
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Project
          Value: steuerberater-copilot
        - Key: Component
          Value: reference-demo
        - Key: Environment
          Value: portfolio-test
        - Key: ManagedBy
          Value: cloudformation
        - Key: Lifecycle
          Value: ephemeral

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVpc
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Project
          Value: steuerberater-copilot
        - Key: Component
          Value: reference-demo
        - Key: Environment
          Value: portfolio-test
        - Key: ManagedBy
          Value: cloudformation
        - Key: Lifecycle
          Value: ephemeral

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: steuerberater-copilot
        - Key: Component
          Value: reference-demo
        - Key: Environment
          Value: portfolio-test
        - Key: ManagedBy
          Value: cloudformation
        - Key: Lifecycle
          Value: ephemeral

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DemoVpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DemoVpc
      Tags:
        - Key: Project
          Value: steuerberater-copilot
        - Key: Component
          Value: reference-demo
        - Key: Environment
          Value: portfolio-test
        - Key: ManagedBy
          Value: cloudformation
        - Key: Lifecycle
          Value: ephemeral

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  ExpressGatewayService:
    Type: AWS::ECS::ExpressGatewayService
    Condition: DeployExpressService
    DependsOn:
      - PublicRoute
      - PublicSubnetARouteTableAssociation
      - PublicSubnetBRouteTableAssociation
    Properties:
      Cluster: default
      ServiceName: steuerberater-copilot-reference-demo
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      InfrastructureRoleArn: !Ref ExpressInfrastructureRoleArn
      HealthCheckPath: /health
      NetworkConfiguration:
        Subnets:
          - !Ref PublicSubnetA
          - !Ref PublicSubnetB
      PrimaryContainer:
        Image: !Ref ImageUri
        ContainerPort: 8000
        AwsLogsConfiguration:
          LogGroup: !Ref ApplicationLogGroup
          LogStreamPrefix: ecs
      ScalingTarget:
        MinTaskCount: 1
        MaxTaskCount: 1
      Tags:
        - Key: Project
          Value: steuerberater-copilot
        - Key: Component
          Value: reference-demo
        - Key: Environment
          Value: portfolio-test
        - Key: ManagedBy
          Value: cloudformation
        - Key: Lifecycle
          Value: ephemeral

Outputs:
  EcrRepositoryUri:
    Description: URI of the private ECR repository for digest image pushes.
    Value: !GetAtt ReferenceDemoRepository.RepositoryUri

  LogGroupName:
    Description: Stack-managed CloudWatch log group name (14-day retention).
    Value: !Ref ApplicationLogGroup

  ServiceEndpoint:
    Condition: DeployExpressService
    Description: HTTPS endpoint of the Express Gateway service.
    Value: !GetAtt ExpressGatewayService.Endpoint
