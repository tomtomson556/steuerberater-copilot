AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Static ECS Express Mode IAM roles for the synthetic AWS reference-cloud demo.
  Exactly two named AWS::IAM::Role resources outside the ephemeral demo stack:
  Task Execution Role and Express Infrastructure Role. Each role attaches one
  AWS managed policy only. No Task Role, no Secrets Manager rights, no inline
  or customer-managed policies, and no permissions boundaries. This template
  does not authorize an AWS live test.

Resources:
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: steuerberater-copilot-reference-demo-task-execution
      Description: >
        Static ECS task execution role for the synthetic reference demo.
        Assumed only by ecs-tasks.amazonaws.com. Attaches exclusively
        AmazonECSTaskExecutionRolePolicy.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ExpressInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: steuerberater-copilot-reference-demo-express-infrastructure
      Description: >
        Static ECS Express infrastructure role for the synthetic reference demo.
        Assumed only by ecs.amazonaws.com. Attaches exclusively
        AmazonECSInfrastructureRoleforExpressGatewayServices.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices

Outputs:
  TaskExecutionRoleArn:
    Description: ARN of the static Task Execution Role assumed by ecs-tasks.amazonaws.com.
    Value: !GetAtt TaskExecutionRole.Arn

  ExpressInfrastructureRoleArn:
    Description: >
      ARN of the static Express Infrastructure Role assumed by ecs.amazonaws.com.
    Value: !GetAtt ExpressInfrastructureRole.Arn
